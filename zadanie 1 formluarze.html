<!DOCTYPE html>
<html>
<head>
<title>Zadanie 1</title>
</head>
<body>
<form action="skrypt_form.php" method="post">
<h3>Dane podstawowe</h3>
<p>Podaj swoje imię:
<input type="text" name="imie" size="20" maxlength="20" accesskey="I"></p>
<p>Podaj login:
<input type="text" name="login" size="10" maxlength="8" accesskey="L"></p>
<p>Podaj hasło:
<input type="password" name="haslo" accesskey="H"></p>
<p>Wybierz miasto:
<input list="miasta" name="miasto"></p>
<datalist id="miasta">
<option value="Warszawa">
<option value="Kraków">
<option value="Gdańsk">
</datalist>
<h3>Dane kontaktowe</h3>
<p>Podaj e-mail:
<input type="email" name="mail" accesskey="M"></p>
<p>Podaj kod pocztowy:
<input type="text" name="kod_pocztowy"></p>
<p>Podaj numer telefonu:
<input type="tel" name="telefon"></p>
<h3>Dodatkowe informacje</h3>
<p>Podaj datę urodzenia:
<input type="date" name="data_ur" accesskey="D"></p>
<p>Wybierz wykształcenie:
<select name="wyksztalcenie">
<option>Podstawowe</option>
<option>Średnie</option>
<option>Wyższe</option>
</select></p>
<p><input type="checkbox" name="zgoda" accesskey="Z">
Akceptuję regulamin</p>
<p>Życiorys:</p>
<textarea name="opis" rows="6" cols="40">
Wpisz kilka informacji o sobie
</textarea>
<br><br>
<input type="submit" value="Wyślij dane">
<input type="reset" value="Wyczyść formularz">
</form>
</body>
</html>
